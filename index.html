<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit a Complaint</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fef3c7 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --accent-pink: #ec4899;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .form-container {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }

    .form-header {
      background: var(--primary-gradient);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .form-header h2 {
      margin: 0 0 10px 0;
      font-size: 28px;
    }

    .form-header p {
      margin: 0;
      opacity: 0.9;
    }

    .form-body {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .category-card {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-card:hover {
      border-color: #ec4899;
      background-color: #fdf2f8;
      transform: translateY(-2px);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body>

<div class="form-container">
  <div class="form-header">
    <h2>Register a Complaint</h2>
    <p>We're here to help! Let us know what went wrong.</p>
  </div>
  
  <form class="form-body">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" class="form-control" placeholder="Jane Doe" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
    </div>

    <div class="form-group">
      <label>Category</label>
      <div class="category-grid">
        <div class="category-card" style="border-left: 4px solid #3b82f6;">💻 Technical</div>
        <div class="category-card" style="border-left: 4px solid #10b981;">💳 Billing</div>
        <div class="category-card" style="border-left: 4px solid #f59e0b;">📦 Delivery</div>
      </div>
    </div>

    <div class="form-group">
      <label for="subject">Complaint Subject</label>
      <input type="text" id="subject" class="form-control" placeholder="Brief summary" required>
    </div>

    <div class="form-group">
      <label for="details">Detailed Description</label>
      <textarea id="details" class="form-control" rows="4" placeholder="Describe your issue..." required></textarea>
    </div>

    <button type="submit" class="btn-submit">Submit Complaint</button>
  </form>
</div>

</body>
</html>
