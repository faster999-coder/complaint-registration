<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit a Complaint</title>

  <style>
    :root {
      --primary-green: #86efac;
      --dark-green: #14532d;
      --light-green: #f0fdf4;
      --border-green: #22c55e;
      --text-main: #1e293b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7, #ecfdf5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .form-container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }

    .form-header {
      background: linear-gradient(135deg, #bbf7d0, #86efac);
      color: var(--dark-green);
      padding: 30px;
      text-align: center;
    }

    .form-header h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .form-header p {
      margin: 0;
      opacity: 0.9;
    }

    .form-body {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      transition: 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--border-green);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .category-card {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
      background: #ffffff;
      font-weight: 600;
    }

    .category-card:hover {
      border-color: var(--border-green);
      background: #f0fdf4;
      transform: translateY(-2px);
    }

    .category-card.selected {
      border: 2px solid #16a34a;
      background: #bbf7d0;
      color: #14532d;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
      transform: translateY(-2px);
    }

    .selected-category {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #f0fdf4;
      color: #166534;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .word-counter {
      text-align: right;
      font-size: 13px;
      margin-top: 5px;
      color: #64748b;
    }

    .word-counter.valid {
      color: #16a34a;
      font-weight: 600;
    }

    .word-counter.invalid {
      color: #dc2626;
    }

    .error-message {
      color: #dc2626;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    .btn-submit {
      width: 100%;
      background: #86efac;
      color: #14532d;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-submit:hover {
      background: #4ade80;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.25);
    }

    @media (max-width: 600px) {
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .form-body {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="form-container">

    <div class="form-header">
      <h2>Register a Complaint</h2>
      <p>We're here to help! Let us know what went wrong.</p>
    </div>

    <form class="form-body" id="complaintForm">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          class="form-control"
          placeholder="Enter Name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="yash143@gmail.com"
          required
        >
      </div>

      <div class="form-group">
        <label>Category</label>

        <div class="category-grid">

          <div class="category-card" data-category="Technical">
            💻 Technical
          </div>

          <div class="category-card" data-category="Billing">
            💳 Billing
          </div>

          <div class="category-card" data-category="Delivery">
            📦 Delivery
          </div>

          <div class="category-card" data-category="Service">
            🛠️ Service
          </div>

          <div class="category-card" data-category="Account">
            👤 Account
          </div>

          <div class="category-card" data-category="Other">
            📋 Other
          </div>

        </div>

        <div id="selectedCategory" class="selected-category"></div>

        <input type="hidden" id="category" required>
      </div>

      <div class="form-group">
        <label for="subject">Complaint Subject</label>
        <input
          type="text"
          id="subject"
          class="form-control"
          placeholder="Brief summary"
          required
        >
      </div>

      <div class="form-group">
        <label for="details">Detailed Description</label>

        <textarea
          id="details"
          class="form-control"
          rows="5"
          placeholder="Describe your issue in at least 30 words..."
          required
        ></textarea>

        <div id="wordCounter" class="word-counter">
          0 / 30 words
        </div>

        <div id="errorMessage" class="error-message">
          Description must contain at least 30 words.
        </div>
      </div>

      <button type="submit" class="btn-submit">
        Submit Complaint
      </button>

    </form>
  </div>

  <script>
    const categoryCards = document.querySelectorAll(".category-card");
    const categoryInput = document.getElementById("category");
    const selectedCategory = document.getElementById("selectedCategory");

    categoryCards.forEach(card => {
      card.addEventListener("click", function() {

        categoryCards.forEach(item => {
          item.classList.remove("selected");
        });

        this.classList.add("selected");

        const categoryName = this.getAttribute("data-category");

        categoryInput.value = categoryName;

        selectedCategory.textContent = "Selected Category: " + categoryName;
        selectedCategory.style.display = "block";
      });
    });

    const details = document.getElementById("details");
    const wordCounter = document.getElementById("wordCounter");
    const errorMessage = document.getElementById("errorMessage");
    const complaintForm = document.getElementById("complaintForm");

    function countWords(text) {
      return text.trim() === ""
        ? 0
        : text.trim().split(/\s+/).length;
    }

    details.addEventListener("input", function() {
      const words = countWords(this.value);

      wordCounter.textContent = words + " / 30 words";

      if (words >= 30) {
        wordCounter.classList.remove("invalid");
        wordCounter.classList.add("valid");
        errorMessage.style.display = "none";
      } else {
        wordCounter.classList.remove("valid");
        wordCounter.classList.add("invalid");
      }
    });

    complaintForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const words = countWords(details.value);

      if (categoryInput.value === "") {
        alert("Please select a complaint category.");
        return;
      }

      if (words < 30) {
        errorMessage.style.display = "block";
        details.focus();
        return;
      }

      alert("Complaint submitted successfully!");

      complaintForm.reset();

      categoryCards.forEach(card => {
        card.classList.remove("selected");
      });

      selectedCategory.style.display = "none";
      selectedCategory.textContent = "";
      categoryInput.value = "";

      wordCounter.textContent = "0 / 30 words";
      wordCounter.classList.remove("valid");
      wordCounter.classList.remove("invalid");
      errorMessage.style.display = "none";
    });
  </script>

</body>
</html>
