<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit a Complaint</title>

  <style>

    :root {
      --primary-green: #86efac;
      --light-green: #f0fdf4;
      --dark-green: #166534;
      --border-green: #4ade80;
      --text-main: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7, #ecfdf5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    .form-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }

    .form-header {
      background: linear-gradient(135deg, #bbf7d0, #86efac);
      color: #14532d;
      padding: 30px;
      text-align: center;
    }

    .form-header h2 {
      margin: 0 0 10px 0;
      font-size: 28px;
    }

    .form-header p {
      margin: 0;
      color: #166534;
    }

    .form-body {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
      transition: 0.3s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--border-green);
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
    }


    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .category-card {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }

    .category-card:hover {
      border-color: var(--border-green);
      background-color: var(--light-green);
      transform: translateY(-2px);
    }

    .category-card.selected {
      border-color: #22c55e;
      background-color: #dcfce7;
      color: #166534;
      font-weight: bold;
    }

    .word-counter {
      margin-top: 6px;
      font-size: 13px;
      color: #dc2626;
      font-weight: 600;
    }

    .word-counter.valid {
      color: #16a34a;
    }

    .btn-submit {
      width: 100%;
      background: #86efac;
      color: #14532d;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-submit:hover {
      background: #4ade80;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.25);
    }

    .error-message {
      color: #dc2626;
      font-size: 14px;
      margin-top: 6px;
      display: none;
    }

    @media (max-width: 600px) {

      .category-grid {
        grid-template-columns: 1fr;
      }

      .form-body {
        padding: 20px;
      }

      .form-header h2 {
        font-size: 24px;
      }
    }

  </style>
</head>

<body>

<div class="form-container">


  <div class="form-header">

    <h2>Register a Complaint</h2>

    <p>
      We're here to help! Let us know what went wrong.
    </p>

  </div>


  <form class="form-body" id="complaintForm">


    <div class="form-group">

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        class="form-control"
        placeholder="Enter Name"
        required
      >

    </div>


    <div class="form-group">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        class="form-control"
        placeholder="piyush123@gmail.com"
        required
      >

    </div>


    <div class="form-group">

      <label>
        Category
      </label>

      <div class="category-grid">

        <div
          class="category-card"
          data-category="Technical"
          style="border-left: 4px solid #3b82f6;"
        >
          💻 Technical
        </div>

        <div
          class="category-card"
          data-category="Billing"
          style="border-left: 4px solid #10b981;"
        >
          💳 Billing
        </div>

        <div
          class="category-card"
          data-category="Delivery"
          style="border-left: 4px solid #f59e0b;"
        >
          📦 Delivery
        </div>

      </div>

    </div>


    <div class="form-group">

      <label for="subject">
        Complaint Subject
      </label>

      <input
        type="text"
        id="subject"
        class="form-control"
        placeholder="Brief summary"
        required
      >

    </div>


    <div class="form-group">

      <label for="details">
        Detailed Description
      </label>

      <textarea
        id="details"
        class="form-control"
        rows="5"
        placeholder="Describe your issue in at least 30 words..."
        required
      ></textarea>

      <div id="wordCounter" class="word-counter">
        0 / 30 words
      </div>

      <div id="errorMessage" class="error-message">
        Please enter at least 30 words in the description.
      </div>

    </div>


    <button
      type="submit"
      class="btn-submit"
    >
      Submit Complaint
    </button>

  </form>

</div>


<script>

  const categories =
    document.querySelectorAll(".category-card");

  categories.forEach(category => {

    category.addEventListener("click", function() {

      categories.forEach(item => {
        item.classList.remove("selected");
      });

      this.classList.add("selected");

    });

  });


  const details =
    document.getElementById("details");

  const wordCounter =
    document.getElementById("wordCounter");

  const errorMessage =
    document.getElementById("errorMessage");


  function countWords(text) {

    return text
      .trim()
      .split(/\s+/)
      .filter(word => word.length > 0)
      .length;

  }


  details.addEventListener("input", function() {

    const words =
      countWords(this.value);

    wordCounter.textContent =
      words + " / 30 words";


    if (words >= 30) {

      wordCounter.classList.add("valid");

      errorMessage.style.display =
        "none";

    } else {

      wordCounter.classList.remove("valid");

    }

  });
